# Speaking rubric — Elementary
# Источник: методист Yappi. Язык инструкций для Claude: русский.
# CEFR-ориентир: A2 (элементарный).
#
# Шкала по каждой категории: 5 | 10 | 15 | 20 | 25
# 25 — отлично · 20 — очень хорошо · 15 — хорошо · 10 — удовлетворительно · 5 — неудовлетворительно

level: elementary
level_label_ru: "Elementary"
cefr_range: "A2"

scoring_scale:
  max_per_category: 25
  bands:
    25: "Отлично"
    20: "Очень хорошо"
    15: "Хорошо"
    10: "Удовлетворительно"
    5: "Неудовлетворительно"

categories:

  fluency:
    label_ru: "Плавность речи"
    label_en: "Fluency"
    descriptors:
      25: >
        Свободно строит простые предложения;
        незначительные паузы только при формулировке более сложных мыслей.
      20: >
        Большинство простых высказываний звучит плавно;
        короткие паузы при формулировке есть, но редки.
      15: >
        Говорит понятно, но с частыми паузами при построении высказываний.
      10: >
        Речь прерывистая; паузы и самокоррекция заметно замедляют коммуникацию.
      5: >
        Очень частые паузы и самокоррекция делают плавную речь невозможной.

  accuracy:
    label_ru: "Грамматическая точность"
    label_en: "Accuracy"
    descriptors:
      25: >
        Уверенно использует грамматику уровня (Past Simple, Present Continuous,
        модальные глаголы); редкие ошибки.
      20: >
        Большинство структур уровня употребляется правильно;
        мелкие несистемные ошибки.
      15: >
        Структуры уровня в основном правильные; есть повторяющиеся ошибки.
      10: >
        Регулярные ошибки в структурах уровня; понимание затруднено.
      5: >
        Многочисленные системные ошибки в структурах уровня;
        понимание существенно затруднено.

  coherency:
    label_ru: "Связность и логика"
    label_en: "Coherency"
    descriptors:
      25: >
        Строит связные простые высказывания;
        правильно использует базовые связки (and, but, because, so).
      20: >
        Высказывания в целом последовательны;
        связки иногда употребляются не совсем точно.
      15: >
        В целом связная речь; иногда не хватает союзов или чётких переходов.
      10: >
        Слабая связность; связки отсутствуют или употребляются хаотично.
      5: >
        Высказывания распадаются; логику почти невозможно проследить.

  new_language_usage:
    label_ru: "Использование нового языкового материала"
    label_en: "New Language Usage"
    descriptors:
      25: >
        Органично употребляет новые слова и грамматические конструкции модуля
        в речи, без ошибок.
      20: >
        Уверенно использует большую часть новых слов и конструкций;
        единичные неточности.
      15: >
        Регулярно использует новую лексику;
        некоторые конструкции употребляются не совсем точно.
      10: >
        Присутствуют лишь отдельные новые элементы;
        преобладает ранее изученная лексика.
      5: >
        Новый материал практически отсутствует;
        студент использует только базовый знакомый словарный запас.

agent_instructions_ru: |
  Оценивай speaking студента уровня Elementary (A2) строго по дескрипторам выше.
  Для каждой из четырёх категорий выбери одну полосу: 5, 10, 15, 20 или 25 — по ближайшему соответствию речи в транскрипте.
  Не ожидай от Elementary студента структур и лексики уровня B1+.
  Ошибки в структурах уровня (Past Simple, Present Continuous, модальные глаголы) учитывай в accuracy и в grammar_errors.
  Связки (and, but, because, so) учитывай при оценке coherency.
  Новую лексику и конструкции модуля оценивай только если в контексте урока или транскрипта видно, какой материал проходился.
