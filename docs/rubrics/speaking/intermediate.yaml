# Speaking rubric — Intermediate
# Источник: методист Yappi. Язык инструкций для Claude: русский.
# CEFR-ориентир: B2 (средний / upper-intermediate).
#
# Шкала по каждой категории: 5 | 10 | 15 | 20 | 25
# 25 — отлично · 20 — очень хорошо · 15 — хорошо · 10 — удовлетворительно · 5 — неудовлетворительно

level: intermediate
level_label_ru: "Intermediate"
cefr_range: "B2"

scoring_scale:
  max_per_category: 25
  bands:
    25: "Отлично"
    20: "Очень хорошо"
    15: "Хорошо"
    10: "Удовлетворительно"
    5: "Неудовлетворительно"

categories:

  fluency:
    label_ru: "Плавность речи"
    label_en: "Fluency"
    descriptors:
      25: >
        Поддерживает плавный темп на большинстве тем;
        естественный ритм и плавный переход между идеями.
      20: >
        Плавная речь с редкими паузами;
        хороший контроль темпа для данного уровня.
      15: >
        В целом плавная речь;
        паузы возникают при сложных идеях или поиске лексики.
      10: >
        Заметные паузы нарушают плавность;
        сложные идеи формулируются медленно.
      5: >
        Частые длительные паузы разрушают коммуникацию;
        не соответствует плавности уровня.

  accuracy:
    label_ru: "Грамматическая точность"
    label_en: "Accuracy"
    descriptors:
      25: >
        Уверенно использует грамматику уровня (условные предложения,
        пассивный залог, reported speech); единичные ошибки.
      20: >
        Грамматика уровня в целом точная;
        мелкие ошибки не нарушают коммуникацию.
      15: >
        Большинство структур уровня используется правильно;
        ошибки несистемные.
      10: >
        Заметные и частые ошибки в структурах уровня;
        смысл сохраняется, но восприятие затруднено.
      5: >
        Многочисленные ошибки разрушают коммуникацию;
        грамматика уровня не сформирована.

  coherency:
    label_ru: "Связность и логика"
    label_en: "Coherency"
    descriptors:
      25: >
        Хорошо структурированная, логичная речь;
        уверенно использует дискурсивные маркеры уровня.
      20: >
        Логичная и последовательная речь;
        редкие незначительные нарушения связности.
      15: >
        Речь в целом связная;
        некоторые идеи не развиты или переходы нечёткие.
      10: >
        Заметные нарушения связности;
        идеи часто не связаны или развиты непоследовательно.
      5: >
        Речь распадается на несвязанные фрагменты;
        коммуникация нарушена.

  new_language_usage:
    label_ru: "Использование нового языкового материала"
    label_en: "New Language Usage"
    descriptors:
      25: >
        Уверенно использует новый языковой материал модуля;
        лексика и структуры звучат естественно.
      20: >
        Большая часть нового материала модуля употребляется правильно
        и естественно в речи.
      15: >
        Новый материал заметен в речи;
        не всегда употребляется точно или естественно.
      10: >
        Мало нового материала в речи;
        студент избегает новых конструкций.
      5: >
        Новая лексика и структуры модуля отсутствуют в речи.

agent_instructions_ru: |
  Оценивай speaking студента уровня Intermediate (B2) строго по дескрипторам выше.
  Для каждой из четырёх категорий выбери одну полосу: 5, 10, 15, 20 или 25 — по ближайшему соответствию речи в транскрипте.
  Не ожидай от Intermediate студента структур и лексики уровня C1+.
  Ошибки в структурах уровня (conditionals, passive, reported speech) учитывай в accuracy и в grammar_errors.
  Дискурсивные маркеры и логику развития идей учитывай при оценке coherency.
  Новую лексику и структуры модуля оценивай только если в контексте урока или транскрипта видно, какой материал проходился.
