# Speaking rubric — Beginner
# Источник: методист Yappi. Язык инструкций для Claude: русский.
# CEFR-ориентир: A1 (начальный).
#
# Шкала по каждой категории: 5 | 10 | 15 | 20 | 25
# 25 — отлично · 20 — очень хорошо · 15 — хорошо · 10 — удовлетворительно · 5 — неудовлетворительно

level: beginner
level_label_ru: "Beginner"
cefr_range: "A1"

scoring_scale:
  max_per_category: 25
  bands:
    25: "Отлично"
    20: "Очень хорошо"
    15: "Хорошо"
    10: "Удовлетворительно"
    5: "Неудовлетворительно"

categories:

  fluency:
    label_ru: "Плавность речи"
    label_en: "Fluency"
    descriptors:
      25: >
        Произносит простые фразы плавно, без длительных пауз.
        Темп медленный, но ровный и естественный для данного уровня.
      20: >
        Строит простые фразы в основном плавно;
        редкие паузы не мешают коммуникации.
      15: >
        Справляется с простыми фразами, но с заметными паузами между словами.
      10: >
        Частые длительные паузы между словами;
        трудно поддерживать темп даже в простых фразах.
      5: >
        Не может произнести простые фразы без длительных пауз;
        речь постоянно прерывается.

  accuracy:
    label_ru: "Грамматическая точность"
    label_en: "Accuracy"
    descriptors:
      25: >
        Правильно использует базовые структуры (to be, Present Simple, артикли);
        единичные ошибки не нарушают коммуникацию.
      20: >
        В основном правильно использует базовые структуры;
        мелкие несистемные ошибки не мешают пониманию.
      15: >
        Базовые структуры в основном правильные;
        ошибки есть, но не разрушают коммуникацию.
      10: >
        Частые ошибки в базовых структурах;
        смысл понятен, но восприятие требует усилий.
      5: >
        Систематические ошибки даже в простейших структурах;
        коммуникация существенно нарушена.

  coherency:
    label_ru: "Связность и логика"
    label_en: "Coherency"
    descriptors:
      25: >
        Отвечает на вопросы последовательно;
        простые идеи связаны между собой и понятны.
      20: >
        Простые ответы в основном связные;
        редкие незначительные перебои в логике.
      15: >
        Простые идеи в основном связаны;
        иногда ответ распадается на отдельные фразы.
      10: >
        Ответ часто состоит из отдельных слов или фраз без связи между ними.
      5: >
        Единичные слова или фразы без какой-либо связи;
        логика отсутствует.

  new_language_usage:
    label_ru: "Использование нового языкового материала"
    label_en: "New Language Usage"
    descriptors:
      25: >
        Уверенно и правильно использует всю новую лексику модуля
        (числа, цвета, базовые существительные, глаголы) и базовые структуры.
      20: >
        Хорошо употребляет большую часть новой лексики модуля;
        редкие ошибки в употреблении не мешают пониманию.
      15: >
        Употребляет немало новых слов, но иногда с ошибками или неуверенно.
      10: >
        Употребляет некоторые новые слова, но в основном опирается
        на ранее известный материал.
      5: >
        Новые слова почти не употребляются;
        речь полностью опирается на ранее известный материал.

agent_instructions_ru: |
  Оценивай speaking студента уровня Beginner (A1) строго по дескрипторам выше.
  Для каждой из четырёх категорий выбери одну полосу: 5, 10, 15, 20 или 25 — по ближайшему соответствию речи в транскрипте.
  Не ожидай от Beginner студента структур и лексики уровня A2+.
  Ошибки в базовых структурах (to be, Present Simple, артикли) учитывай в accuracy и в grammar_errors.
  Новую лексику модуля оценивай только если в контексте урока или транскрипта видно, какой материал проходился.
