# Speaking rubric — Upper-Intermediate
# Источник: методист Yappi. Язык инструкций для Claude: русский.
# CEFR-ориентир: B2+ / C1 (верхний intermediate).
#
# Шкала по каждой категории: 5 | 10 | 15 | 20 | 25
# 25 — отлично · 20 — очень хорошо · 15 — хорошо · 10 — удовлетворительно · 5 — неудовлетворительно

level: upper_intermediate
level_label_ru: "Upper-Intermediate"
cefr_range: "B2+"

scoring_scale:
  max_per_category: 25
  bands:
    25: "Отлично"
    20: "Очень хорошо"
    15: "Хорошо"
    10: "Удовлетворительно"
    5: "Неудовлетворительно"

categories:

  fluency:
    label_ru: "Плавность речи"
    label_en: "Fluency"
    descriptors:
      25: >
        Почти естественная плавность;
        лёгкие переходы между сложными идеями без неоправданных пауз.
      20: >
        Плавная, уверенная речь;
        единичные паузы только при очень сложных идеях.
      15: >
        Плавная речь;
        иногда замедляется при абстрактных или сложных темах.
      10: >
        Паузы мешают плавности, особенно при абстрактных или сложных темах.
      5: >
        Плавность значительно ниже ожидаемой для уровня;
        речь прерывистая и нестабильная.

  accuracy:
    label_ru: "Грамматическая точность"
    label_en: "Accuracy"
    descriptors:
      25: >
        Точное использование сложных структур уровня (mixed conditionals,
        inversion, cleft sentences); единичные ошибки.
      20: >
        Сложные структуры уровня употребляются уверенно;
        редкие несистемные ошибки.
      15: >
        Сложные структуры в основном правильные;
        ошибки не мешают пониманию.
      10: >
        Частые ошибки в сложных структурах уровня;
        некоторые конструкции употребляются некорректно.
      5: >
        Систематические ошибки в сложных структурах;
        речь значительно ниже стандарта уровня.

  coherency:
    label_ru: "Связность и логика"
    label_en: "Coherency"
    descriptors:
      25: >
        Развитая логика и структура высказываний;
        широкий арсенал связующих средств.
      20: >
        Чёткие, хорошо связанные высказывания;
        единичные незначительные нарушения структуры.
      15: >
        Преимущественно чёткая структура;
        изредка теряет логику при сложных или абстрактных идеях.
      10: >
        Частые проблемы со структурой и связностью;
        сложные идеи подаются хаотично.
      5: >
        Выраженные проблемы со связностью и структурой,
        не соответствующие уровню.

  new_language_usage:
    label_ru: "Использование нового языкового материала"
    label_en: "New Language Usage"
    descriptors:
      25: >
        Безупречно интегрирует сложную лексику и структуры текущего модуля в речь.
      20: >
        Сложный языковой материал в основном употребляется корректно;
        мелкие неточности.
      15: >
        Новый материал присутствует;
        отдельные ошибки в употреблении сложных конструкций.
      10: >
        Новый материал употребляется редко и неуверенно;
        преобладает знакомый репертуар.
      5: >
        Студент не демонстрирует использования нового языкового материала уровня.

agent_instructions_ru: |
  Оценивай speaking студента уровня Upper-Intermediate (B2+) строго по дескрипторам выше.
  Для каждой из четырёх категорий выбери одну полосу: 5, 10, 15, 20 или 25 — по ближайшему соответствию речи в транскрипте.
  Не ожидай от Upper-Intermediate студента безупречности уровня C2.
  Ошибки в сложных структурах (mixed conditionals, inversion, cleft sentences) учитывай в accuracy и в grammar_errors.
  Логику, структуру и связующие средства учитывай при оценке coherency.
  Новую лексику и структуры модуля оценивай только если в контексте урока или транскрипта видно, какой материал проходился.
