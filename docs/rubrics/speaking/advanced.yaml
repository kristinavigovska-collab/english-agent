# Speaking rubric — Advanced
# Источник: методист Yappi. Язык инструкций для Claude: русский.
# CEFR-ориентир: C1 (продвинутый).
#
# Шкала по каждой категории: 5 | 10 | 15 | 20 | 25
# 25 — отлично · 20 — очень хорошо · 15 — хорошо · 10 — удовлетворительно · 5 — неудовлетворительно

level: advanced
level_label_ru: "Advanced"
cefr_range: "C1"

scoring_scale:
  max_per_category: 25
  bands:
    25: "Отлично"
    20: "Очень хорошо"
    15: "Хорошо"
    10: "Удовлетворительно"
    5: "Неудовлетворительно"

categories:

  fluency:
    label_ru: "Плавность речи"
    label_en: "Fluency"
    descriptors:
      25: >
        Полностью естественная, плавная речь;
        отличный контроль темпа, ритма и интонации.
      20: >
        Плавная речь;
        очень редкие паузы практически не влияют на общее впечатление.
      15: >
        Преимущественно плавная речь;
        редкие паузы при поиске точной формулировки.
      10: >
        Частые паузы разрушают ожидаемую плавность уровня;
        темп нестабильный.
      5: >
        Выраженные трудности с плавностью;
        речь не соответствует стандартам уровня.

  accuracy:
    label_ru: "Грамматическая точность"
    label_en: "Accuracy"
    descriptors:
      25: >
        Безупречное или почти безупречное использование самых сложных
        грамматических структур; единичные ошибки не влияют на восприятие.
      20: >
        Очень точное использование сложной грамматики;
        единичные ошибки только в самых сложных структурах.
      15: >
        Грамматика в основном точная;
        ошибки редки, но встречаются в сложных конструкциях.
      10: >
        Грамматические ошибки ниже ожиданий уровня;
        системные недочёты в сложных конструкциях.
      5: >
        Выраженные систематические ошибки, не соответствующие уровню;
        коммуникация нарушена.

  coherency:
    label_ru: "Связность и логика"
    label_en: "Coherency"
    descriptors:
      25: >
        Полностью связная, сложно организованная речь;
        отличное управление структурой высказывания.
      20: >
        Очень связная и логичная речь;
        редкие нарушения не влияют на понимание.
      15: >
        В основном связная речь;
        иногда не хватает точности в структурировании сложных идей.
      10: >
        Связность ниже стандарта уровня;
        сложные идеи не имеют чёткой логической структуры.
      5: >
        Связность и структура практически отсутствуют;
        речь не соответствует стандартам уровня.

  new_language_usage:
    label_ru: "Использование нового языкового материала"
    label_en: "New Language Usage"
    descriptors:
      25: >
        Естественно и точно использует сложный языковой материал уровня;
        отражает полное усвоение темы.
      20: >
        Новый материал хорошо интегрирован в речь;
        единичные неточности в самых сложных элементах.
      15: >
        Новый материал употребляется, но не всегда с желаемой точностью
        или уместностью.
      10: >
        Очень ограниченное использование нового языкового материала уровня;
        студент тяготеет к привычным конструкциям.
      5: >
        Нет использования нового языкового материала текущего модуля.

agent_instructions_ru: |
  Оценивай speaking студента уровня Advanced (C1) строго по дескрипторам выше.
  Для каждой из четырёх категорий выбери одну полосу: 5, 10, 15, 20 или 25 — по ближайшему соответствию речи в транскрипте.
  Не штрафуй за отсутствие нюансов уровня C2, если речь соответствует C1.
  Ошибки в сложных грамматических конструкциях учитывай в accuracy и в grammar_errors.
  Структуру и логику сложных высказываний учитывай при оценке coherency.
  Новую лексику и структуры модуля оценивай только если в контексте урока или транскрипта видно, какой материал проходился.
