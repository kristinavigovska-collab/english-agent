# Speaking rubric — Pre-Intermediate
# Источник: методист Yappi. Язык инструкций для Claude: русский.
# CEFR-ориентир: B1 (нижний intermediate).
#
# Шкала по каждой категории: 5 | 10 | 15 | 20 | 25
# 25 — отлично · 20 — очень хорошо · 15 — хорошо · 10 — удовлетворительно · 5 — неудовлетворительно

level: pre_intermediate
level_label_ru: "Pre-Intermediate"
cefr_range: "B1"

scoring_scale:
  max_per_category: 25
  bands:
    25: "Отлично"
    20: "Очень хорошо"
    15: "Хорошо"
    10: "Удовлетворительно"
    5: "Неудовлетворительно"

categories:

  fluency:
    label_ru: "Плавность речи"
    label_en: "Fluency"
    descriptors:
      25: >
        Говорит плавно на знакомые темы;
        паузы контролируемые, естественные, не мешают общению.
      20: >
        Преимущественно плавная речь;
        незначительные паузы при более сложных конструкциях уровня.
      15: >
        Достаточно плавно на знакомые темы;
        заметные паузы при новых конструкциях уровня.
      10: >
        Частые паузы, особенно при переходах между идеями;
        темп неровный.
      5: >
        Речь сильно прерывистая;
        не удаётся поддерживать связный поток высказываний.

  accuracy:
    label_ru: "Грамматическая точность"
    label_en: "Accuracy"
    descriptors:
      25: >
        Правильно использует структуры уровня (Present Perfect, Past Continuous,
        сравнительные степени); единичные ошибки.
      20: >
        Основные структуры уровня используются правильно;
        изредка ошибки при более сложных конструкциях.
      15: >
        Грамматика уровня преимущественно правильная;
        ошибки есть, но общий смысл понятен.
      10: >
        Регулярные ошибки в грамматике уровня;
        смысл в основном понятен, но ошибки системные.
      5: >
        Очень частые ошибки в грамматике уровня;
        смысл трудно понять.

  coherency:
    label_ru: "Связность и логика"
    label_en: "Coherency"
    descriptors:
      25: >
        Чётко организованная речь;
        использует разнообразные связки и переходы уровня.
      20: >
        Связная речь на знакомые темы;
        хороший набор связующих средств уровня.
      15: >
        Преимущественно логичная структура;
        иногда теряет нить или перескакивает между идеями.
      10: >
        Частые разрывы в логике;
        переходы между идеями нечёткие или отсутствуют.
      5: >
        Очень слабая связность;
        идеи разрозненные и непоследовательные.

  new_language_usage:
    label_ru: "Использование нового языкового материала"
    label_en: "New Language Usage"
    descriptors:
      25: >
        Естественно и правильно интегрирует лексику и структуры текущей темы
        в спонтанную речь.
      20: >
        Новый материал употребляется правильно;
        единичные неточности не мешают восприятию.
      15: >
        Новая лексика и структуры присутствуют в речи;
        случаются неточности в употреблении.
      10: >
        Новый материал почти не используется;
        студент опирается на старый языковой репертуар.
      5: >
        Новый языковой материал не используется;
        студент не пытается употреблять лексику темы.

agent_instructions_ru: |
  Оценивай speaking студента уровня Pre-Intermediate (B1) строго по дескрипторам выше.
  Для каждой из четырёх категорий выбери одну полосу: 5, 10, 15, 20 или 25 — по ближайшему соответствию речи в транскрипте.
  Не ожидай от Pre-Intermediate студента структур и лексики уровня B2+.
  Ошибки в структурах уровня (Present Perfect, Past Continuous, comparatives) учитывай в accuracy и в grammar_errors.
  Связки и переходы учитывай при оценке coherency.
  Новую лексику и структуры темы оценивай только если в контексте урока или транскрипта видно, какой материал проходился.
